<div class="page-header">
  <h2>Teams</h2>
  <button mat-flat-button class="create-team-button" routerLink="/teams/create">
    <span>Create Team</span>
  </button>
</div>

@if (errorMessage && !loading) {
  <p class="list-error" role="alert">{{ errorMessage }}</p>
}

<table mat-table [dataSource]="dataSource" class="teams-table">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let team">{{ team.name }}</td>
  </ng-container>

  <ng-container matColumnDef="country">
    <th mat-header-cell *matHeaderCellDef>Country</th>
    <td mat-cell *matCellDef="let team">{{ team.country }}</td>
  </ng-container>

  <ng-container matColumnDef="playersQuantity">
    <th mat-header-cell *matHeaderCellDef>Players Quantity</th>
    <td mat-cell *matCellDef="let team">{{ team.playersQuantity }}</td>
  </ng-container>

  <ng-container matColumnDef="enabled">
    <th mat-header-cell *matHeaderCellDef>Enabled</th>
    <td mat-cell *matCellDef="let team">
      <mat-slide-toggle
        [checked]="team.enabled"
        [aria-label]="'Enabled ' + team.name"
        (change)="setEnabled(team, $event.checked)"
      />
    </td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let team">
      <button
        mat-icon-button
        type="button"
        class="edit-button"
        [routerLink]="['/teams', team.id, 'edit']"
        [attr.aria-label]="'Edit ' + team.name"
      >
        <mat-icon fontSet="material-symbols-outlined">edit</mat-icon>
      </button>
      <button
        mat-icon-button
        type="button"
        class="delete-button"
        [attr.aria-label]="'Delete ' + team.name"
        (click)="confirmDelete(team)"
      >
        <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  <tr *matNoDataRow>
    <td class="empty-state" [attr.colspan]="displayedColumns.length">
      @if (loading) {
        Loading teams...
      } @else if (errorMessage) {
        {{ errorMessage }}
      } @else {
        No teams available
      }
    </td>
  </tr>
</table>
